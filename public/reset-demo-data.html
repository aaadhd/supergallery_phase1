<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reset Demo Data</title>
  <style>
    body { font-family: system-ui; padding: 40px; background: #0a0a0a; color: #e5e5e5; }
    button { background: #ef4444; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 8px; }
    button.green { background: #22c55e; }
    pre { background: #1a1a1a; padding: 16px; border-radius: 8px; font-size: 13px; color: #86efac; overflow: auto; }
  </style>
</head>
<body>
  <h2>🔧 Demo Data Manager</h2>
  <p>Pick 세션과 기획전 시드 데이터를 초기화합니다.</p>
  <button onclick="clearPicks()">artier_picks_v1 삭제</button>
  <button onclick="clearCurations()">artier_curation_v1 삭제</button>
  <button onclick="clearAll()">둘 다 삭제</button>
  <button class="green" onclick="goAdmin()">어드민으로 이동 →</button>
  <button class="green" onclick="goEvents()">Events 탭으로 이동 →</button>
  <pre id="log">로그...</pre>

  <script>
    const log = (msg) => {
      document.getElementById('log').textContent = msg;
    };
    function clearPicks() {
      localStorage.removeItem('artier_picks_v1');
      log('artier_picks_v1 삭제 완료.\n페이지를 새로고침하면 시드가 다시 생성됩니다.');
    }
    function clearCurations() {
      localStorage.removeItem('artier_curation_v1');
      log('artier_curation_v1 삭제 완료.\n앱 재로드 시 시드가 다시 생성됩니다.');
    }
    function clearAll() {
      localStorage.removeItem('artier_picks_v1');
      localStorage.removeItem('artier_curation_v1');
      log('Pick + 기획전 데이터 모두 삭제 완료.\n/으로 이동하면 시드가 자동 생성됩니다.');
    }
    function goAdmin() { window.location.href = '/admin/picks'; }
    function goEvents() { window.location.href = '/events?tab=pick'; }

    // 현재 상태 표시
    const picks = localStorage.getItem('artier_picks_v1');
    const curations = localStorage.getItem('artier_curation_v1');
    const status = [
      'artier_picks_v1: ' + (picks ? JSON.parse(picks).length + '개 세션' : '없음'),
      'artier_curation_v1: ' + (curations ? JSON.parse(curations)?.curatedExhibitions?.length + '개 기획전' : '없음'),
    ].join('\n');
    log(status);
  </script>
</body>
</html>
