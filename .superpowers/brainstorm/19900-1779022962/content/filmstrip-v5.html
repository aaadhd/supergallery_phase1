<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pick — 필름스트립 v5</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8fafc; color: #1e293b; }

.shell { display: flex; min-height: 100vh; }
.sidebar { width: 180px; background: #0f172a; flex-shrink: 0; padding: 16px 12px; }
.sidebar .logo { color: #fff; font-size: 13px; font-weight: 700; margin-bottom: 20px; padding: 0 4px; }
.sidebar nav a { display: block; padding: 7px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; color: #94a3b8; margin-bottom: 2px; text-decoration: none; }
.sidebar nav a.active { background: white; color: #0f172a; }

.main { flex: 1; overflow: auto; }
.content { max-width: 1200px; margin: 0 auto; padding: 24px; }
.page-header { margin-bottom: 20px; }
.page-header h1 { font-size: 20px; font-weight: 700; }
.page-header p { font-size: 13px; color: #64748b; margin-top: 4px; }

.panel { display: grid; grid-template-columns: 200px 1fr; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: white; min-height: 72vh; }

/* 세션 패널 */
.sessions { border-right: 1px solid #e2e8f0; background: #f8fafc; }
.sessions-head { padding: 12px 14px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
.sessions-head span { font-size: 13px; font-weight: 600; }
.sessions-head button { background: #7c3aed; color: white; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 6px; border: none; cursor: pointer; }
.session-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: background .1s; }
.session-item:hover { background: #f1f5f9; }
.session-item.active { background: white; border-left: 3px solid #7c3aed; padding-left: 11px; }
.session-item .s-name { font-size: 12px; font-weight: 600; }
.session-item .s-meta { font-size: 11px; color: #94a3b8; margin-top: 2px; }
.bs { display: inline-flex; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 10px; margin-left: 4px; }
.bs-sch { background: #fef3c7; color: #92400e; }
.bs-act { background: #d1fae5; color: #065f46; }
.bs-end { background: #f1f5f9; color: #94a3b8; }

/* 갤러리 */
.gallery { display: flex; flex-direction: column; }
.gallery-head { padding: 12px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px; }
.gallery-head h2 { font-size: 13px; font-weight: 700; flex: 1; }
.session-status-tag { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
.search-box { border: 1px solid #e2e8f0; border-radius: 8px; padding: 5px 10px; font-size: 12px; color: #94a3b8; width: 180px; }

/* 종료 세션 배너 */
.ended-banner { background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 8px 16px; font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 6px; }
.ended-banner::before { content: '🔒'; }

.gallery-body { flex: 1; overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 5px; }
.tip { font-size: 11px; color: #94a3b8; padding: 4px 0 6px; display: flex; align-items: center; gap: 6px; }
.tip::before { content: '✦'; color: #c4b5fd; }
.section-divider { font-size: 10px; color: #94a3b8; padding: 8px 2px 4px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }

/* 전시 행 */
.ex-row { display: flex; align-items: center; border: 2px solid #e2e8f0; border-radius: 10px; cursor: pointer; transition: border-color .15s; background: white; min-height: 72px; }
.ex-row:hover:not(.readonly) { border-color: #c4b5fd; }
.ex-row.selected { border-color: #7c3aed; background: #fdf8ff; }
.ex-row.readonly { cursor: default; opacity: .75; }
.ex-row.readonly.selected { border-color: #a78bfa; background: #fdf8ff; }

.ex-info { width: 128px; flex-shrink: 0; padding: 10px 11px; border-right: 1px solid #e2e8f0; align-self: stretch; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.pick-num { width: 18px; height: 18px; border-radius: 50%; background: #7c3aed; color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 3px; }
.ex-title { font-size: 11px; font-weight: 700; color: #1e293b; line-height: 1.3; }
.ex-artist { font-size: 10px; color: #64748b; }
.ex-count { font-size: 10px; color: #94a3b8; margin-top: 1px; }

.ex-strip { flex: 1; display: flex; align-items: center; gap: 4px; padding: 9px 10px; overflow-x: auto; scrollbar-width: thin; scrollbar-color: #e2e8f0 transparent; }
.ex-strip::-webkit-scrollbar { height: 3px; }
.ex-strip::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 2px; }

.thumb { flex-shrink: 0; width: 54px; height: 54px; border-radius: 6px; overflow: hidden; position: relative; cursor: pointer; border: 1.5px solid transparent; transition: border-color .1s; }
.thumb:hover { border-color: #7c3aed; }
.thumb .img { width: 100%; height: 100%; }
.thumb .num { position: absolute; bottom: 2px; left: 2px; background: rgba(0,0,0,.6); color: white; font-size: 8px; font-weight: 700; padding: 1px 3px; border-radius: 3px; pointer-events: none; }

/* 호버 팝업 */
#hover-popup { display: none; position: fixed; z-index: 9999; pointer-events: none; border-radius: 12px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.5), 0 0 0 2px #7c3aed; }
#hover-popup .pop-img { width: 240px; height: 240px; }
#hover-popup .pop-label { background: #0f172a; padding: 9px 13px; }
#hover-popup .pop-title { font-size: 12px; font-weight: 700; color: white; }
#hover-popup .pop-sub { font-size: 10px; color: #94a3b8; margin-top: 2px; }

/* 모달 */
.modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 1000; align-items: center; justify-content: center; }
.modal-bg.open { display: flex; }
.modal-wrap { position: relative; display: flex; align-items: center; gap: 12px; max-width: 640px; width: 95%; }
.modal-box { flex: 1; background: #0f172a; border-radius: 16px; overflow: hidden; position: relative; }
.modal-img { width: 100%; aspect-ratio: 1; transition: opacity .1s; }
.modal-footer { padding: 14px 18px; }
.modal-footer .m-title { font-size: 15px; font-weight: 700; color: white; }
.modal-footer .m-meta { font-size: 12px; color: #94a3b8; margin-top: 4px; }
.modal-close { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.12); color: white; border: none; width: 30px; height: 30px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.modal-close:hover { background: rgba(255,255,255,.22); }
.nav-btn { flex-shrink: 0; width: 44px; height: 44px; border-radius: 50%; border: none; background: rgba(255,255,255,.12); color: white; font-size: 22px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
.nav-btn:hover { background: rgba(255,255,255,.25); }
.nav-btn:disabled { opacity: .2; cursor: default; }
.nav-btn:disabled:hover { background: rgba(255,255,255,.12); }
.modal-dots { display: flex; justify-content: center; gap: 5px; padding: 10px 18px 14px; }
.dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.25); transition: background .15s, transform .15s; }
.dot.active { background: #a78bfa; transform: scale(1.3); }

/* 하단 바 */
.bottom-bar { background: #0f172a; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.count { font-size: 12px; color: #c4b5fd; font-weight: 600; }
.spacer { flex: 1; }
.btn-pub { background: #7c3aed; color: white; font-size: 12px; font-weight: 700; padding: 7px 18px; border-radius: 8px; border: none; cursor: pointer; }
.btn-end { background: transparent; border: 1px solid #ef4444; color: #f87171; font-size: 12px; padding: 6px 14px; border-radius: 8px; cursor: pointer; }

.c1{background:linear-gradient(135deg,#f093fb,#f5576c)} .c2{background:linear-gradient(135deg,#4facfe,#00f2fe)} .c3{background:linear-gradient(135deg,#43e97b,#38f9d7)} .c4{background:linear-gradient(135deg,#fa709a,#fee140)} .c5{background:linear-gradient(135deg,#a18cd1,#fbc2eb)} .c6{background:linear-gradient(135deg,#fda085,#f6d365)} .c7{background:linear-gradient(135deg,#89f7fe,#66a6ff)} .c8{background:linear-gradient(135deg,#fddb92,#d1fdff)} .c9{background:linear-gradient(135deg,#667eea,#764ba2)} .c10{background:linear-gradient(135deg,#f77062,#fe5196)}
</style>
</head>
<body>

<div id="hover-popup">
  <div id="pop-img" class="pop-img"></div>
  <div class="pop-label">
    <div class="pop-title" id="pop-title"></div>
    <div class="pop-sub" id="pop-sub"></div>
  </div>
</div>

<div class="shell">
  <div class="sidebar">
    <div class="logo">Proud Gallery 어드민</div>
    <nav>
      <a href="#">대시보드</a><a href="#">검수</a><a href="#">신고</a><a href="#">회원</a>
      <a href="#" class="active">Pick</a><a href="#">기획전</a><a href="#">추천 전시</a>
    </nav>
  </div>

  <div class="main">
    <div class="content">
      <div class="page-header">
        <h1>픽 관리</h1>
        <p>Proud's Pick 세션을 만들고 선정 전시를 관리합니다.</p>
      </div>

      <div class="panel">
        <!-- 세션 목록 -->
        <div class="sessions">
          <div class="sessions-head"><span>픽 세션</span><button>+ 새로</button></div>
          <div class="session-item active" onclick="switchSession(this,'week3')">
            <div class="s-name">5월 3주차 Proud's Pick <span class="bs bs-sch">발행예정</span></div>
            <div class="s-meta">05-19 ~ 05-25 · 3개</div>
          </div>
          <div class="session-item" onclick="switchSession(this,'week2')">
            <div class="s-name">5월 2주차 Proud's Pick <span class="bs bs-act">발행됨</span></div>
            <div class="s-meta">05-12 ~ 05-18 · 6개</div>
          </div>
          <div class="session-item" onclick="switchSession(this,'week1')">
            <div class="s-name">5월 1주차 Proud's Pick <span class="bs bs-end">종료됨</span></div>
            <div class="s-meta">05-05 ~ 05-11 · 5개</div>
          </div>
        </div>

        <!-- 갤러리 -->
        <div class="gallery" id="gallery">
          <!-- JS로 렌더링 -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- 모달 -->
<div class="modal-bg" id="modal" onclick="if(event.target.id==='modal')closeModal()">
  <div class="modal-wrap">
    <button class="nav-btn" id="btn-prev" onclick="navigate(-1)">‹</button>
    <div class="modal-box">
      <button class="modal-close" onclick="closeModal()">✕</button>
      <div id="modal-img" class="modal-img"></div>
      <div class="modal-dots" id="modal-dots"></div>
      <div class="modal-footer">
        <div class="m-title" id="modal-title"></div>
        <div class="m-meta" id="modal-meta"></div>
      </div>
    </div>
    <button class="nav-btn" id="btn-next" onclick="navigate(1)">›</button>
  </div>
</div>

<script>
/* ── 세션 데이터 ── */
const SESSIONS = {
  week3: {
    title: '5월 3주차 Proud\'s Pick',
    range: '05-19 ~ 05-25',
    status: 'scheduled',
    statusLabel: '발행예정',
    statusClass: 'bs-sch',
    ended: false,
    selected: [0, 1, 2],
    exhibitions: [
      { title: '구월 개인전', artist: '구월', works: [{s:'1번 작품·구월',c:'c1'},{s:'2번 작품·구월',c:'c2'},{s:'3번 작품·구월',c:'c3'},{s:'4번 작품·구월',c:'c4'}] },
      { title: '봄의 감성전', artist: '달들리에(김승혜)', works: [{s:'1번',c:'c5'},{s:'2번',c:'c6'},{s:'3번',c:'c7'},{s:'4번',c:'c8'},{s:'5번',c:'c9'}] },
      { title: '동그라미 일러스트 모음전', artist: '김아흔', works: [{s:'1번',c:'c10'},{s:'2번',c:'c1'},{s:'3번',c:'c3'},{s:'4번',c:'c5'},{s:'5번',c:'c7'},{s:'6번',c:'c2'},{s:'7번',c:'c4'},{s:'8번',c:'c6'},{s:'9번',c:'c9'},{s:'10번',c:'c8'}] },
      { title: '컬러링북 아티스트 개인전', artist: '김현경', works: [{s:'1번',c:'c2'},{s:'2번',c:'c6'},{s:'3번',c:'c8'},{s:'4번',c:'c4'},{s:'5번',c:'c1'},{s:'6번',c:'c9'},{s:'7번',c:'c3'},{s:'8번',c:'c7'},{s:'9번',c:'c10'},{s:'10번',c:'c5'}] },
      { title: '나랑하루 개인전', artist: '나랑하루', works: [{s:'1번',c:'c3'},{s:'2번',c:'c7'},{s:'3번',c:'c10'},{s:'4번',c:'c1'},{s:'5번',c:'c6'}] },
      { title: '장생마을 연작전', artist: '달들리에(김승혜)', works: [{s:'1번',c:'c4'},{s:'2번',c:'c8'},{s:'3번',c:'c2'},{s:'4번',c:'c9'}] },
    ]
  },
  week2: {
    title: '5월 2주차 Proud\'s Pick',
    range: '05-12 ~ 05-18',
    status: 'active',
    statusLabel: '발행됨',
    statusClass: 'bs-act',
    ended: false,
    selected: [0,1,2,3,4,5],
    exhibitions: [
      { title: '구카 개인전', artist: '구카', works: [{s:'1번',c:'c2'},{s:'2번',c:'c5'},{s:'3번',c:'c8'},{s:'4번',c:'c3'},{s:'5번',c:'c6'},{s:'6번',c:'c10'},{s:'7번',c:'c1'},{s:'8번',c:'c7'}] },
      { title: '김원미 개인전', artist: '김원미', works: [{s:'1번',c:'c4'},{s:'2번',c:'c9'},{s:'3번',c:'c6'},{s:'4번',c:'c2'},{s:'5번',c:'c7'},{s:'6번',c:'c1'},{s:'7번',c:'c3'},{s:'8번',c:'c5'}] },
      { title: '모바일아트협동조합 정기전', artist: '김정숙', works: [{s:'1번',c:'c7'},{s:'2번',c:'c3'},{s:'3번',c:'c9'},{s:'4번',c:'c5'},{s:'5번',c:'c1'}] },
      { title: '서아의봄', artist: '서아의봄', works: [{s:'1번',c:'c6'},{s:'2번',c:'c10'},{s:'3번',c:'c4'},{s:'4번',c:'c8'},{s:'5번',c:'c2'},{s:'6번',c:'c9'}] },
      { title: '빛과 색채 — 추상화전', artist: '이현수', works: [{s:'1번',c:'c8'},{s:'2번',c:'c1'},{s:'3번',c:'c5'},{s:'4번',c:'c3'}] },
      { title: '수채화 감성전', artist: '박민지', works: [{s:'1번',c:'c5'},{s:'2번',c:'c7'},{s:'3번',c:'c2'},{s:'4번',c:'c6'},{s:'5번',c:'c9'},{s:'6번',c:'c4'}] },
    ]
  },
  week1: {
    title: '5월 1주차 Proud\'s Pick',
    range: '05-05 ~ 05-11',
    status: 'ended',
    statusLabel: '종료됨',
    statusClass: 'bs-end',
    ended: true,
    selected: [0,1,2,3,4],
    exhibitions: [
      { title: '달빛 수채화전', artist: '이가은', works: [{s:'1번',c:'c3'},{s:'2번',c:'c7'},{s:'3번',c:'c1'},{s:'4번',c:'c5'}] },
      { title: '일상의 단면', artist: '정다은', works: [{s:'1번',c:'c9'},{s:'2번',c:'c4'},{s:'3번',c:'c8'},{s:'4번',c:'c2'},{s:'5번',c:'c6'}] },
      { title: '자연을 담다', artist: '최하늘', works: [{s:'1번',c:'c6'},{s:'2번',c:'c10'},{s:'3번',c:'c3'},{s:'4번',c:'c7'}] },
      { title: '사계절 일러스트', artist: '홍민준', works: [{s:'1번',c:'c1'},{s:'2번',c:'c5'},{s:'3번',c:'c9'},{s:'4번',c:'c4'},{s:'5번',c:'c8'},{s:'6번',c:'c2'}] },
      { title: '빛의 정원', artist: '김서현', works: [{s:'1번',c:'c8'},{s:'2번',c:'c3'},{s:'3번',c:'c6'}] },
    ]
  }
};

let currentSession = 'week3';

function switchSession(el, key) {
  document.querySelectorAll('.session-item').forEach(s => s.classList.remove('active'));
  el.classList.add('active');
  currentSession = key;
  renderGallery(key);
}

function renderGallery(key) {
  const s = SESSIONS[key];
  const gallery = document.getElementById('gallery');

  let html = `
    <div class="gallery-head">
      <h2>${s.title}</h2>
      <span class="bs ${s.statusClass}" style="padding:3px 10px">${s.statusLabel}</span>
      ${!s.ended ? '<div class="search-box">🔍 전시·작가 검색…</div>' : ''}
    </div>
    ${s.ended ? '<div class="ended-banner">종료된 세션입니다. 이력 열람만 가능합니다.</div>' : ''}
    <div class="gallery-body">
      <div class="tip">${s.ended ? '종료 세션 — 이미지 확인 가능, 선정 변경 불가' : '이미지에 마우스를 올리면 크게 보여요. 클릭하면 좌우 이동 가능해요.'}</div>
  `;

  const selectedSet = new Set(s.selected);
  const unselected = s.exhibitions.map((_, i) => i).filter(i => !selectedSet.has(i));

  // 선정된 전시
  s.selected.forEach((exIdx, pickIdx) => {
    const ex = s.exhibitions[exIdx];
    html += renderRow(ex, pickIdx + 1, true, s.ended, exIdx);
  });

  // 미선정 (종료 세션에는 안 보임)
  if (!s.ended && unselected.length > 0) {
    html += `<div class="section-divider">── 미선정 전시</div>`;
    unselected.forEach(exIdx => {
      html += renderRow(s.exhibitions[exIdx], null, false, false, exIdx);
    });
  }

  html += `</div>`;

  // 하단 바
  if (!s.ended) {
    const cnt = s.selected.length;
    if (s.status === 'active') {
      html += `<div class="bottom-bar"><span class="count">✦ ${cnt} / 10개 선정</span><div class="spacer"></div><button class="btn-end">게시 종료</button></div>`;
    } else {
      html += `<div class="bottom-bar"><span class="count">✦ ${cnt} / 10개 선정</span><div class="spacer"></div><button class="btn-pub">발행</button></div>`;
    }
  }

  gallery.innerHTML = html;
  bindThumbs();
}

function renderRow(ex, pickNum, selected, readonly, exIdx) {
  const cls = [
    'ex-row',
    selected ? 'selected' : '',
    readonly ? 'readonly' : ''
  ].filter(Boolean).join(' ');

  let info = '';
  if (pickNum) info += `<div class="pick-num">${pickNum}</div>`;
  info += `<div class="ex-title">${ex.title}</div><div class="ex-artist">${ex.artist}</div><div class="ex-count">작품 ${ex.works.length}장</div>`;

  const thumbs = ex.works.map((w, i) =>
    `<div class="thumb" data-i="${i}" data-t="${ex.title}" data-s="${w.s} · ${ex.artist}" data-c="${w.c}">
      <div class="img ${w.c}"></div><div class="num">${i+1}</div>
    </div>`
  ).join('');

  const onclick = readonly ? '' : `onclick="toggleRow(this)"`;

  return `<div class="${cls}" ${onclick} data-ex="${exIdx}">
    <div class="ex-info">${info}</div>
    <div class="ex-strip">${thumbs}</div>
  </div>`;
}

function bindThumbs() {
  document.querySelectorAll('.thumb').forEach(t => {
    t.addEventListener('mouseenter', e => {
      clearTimeout(hideTimer);
      document.getElementById('pop-img').className = 'pop-img ' + t.dataset.c;
      document.getElementById('pop-title').textContent = t.dataset.t;
      document.getElementById('pop-sub').textContent = t.dataset.s;
      document.getElementById('hover-popup').style.display = 'block';
      place(e);
    });
    t.addEventListener('mousemove', place);
    t.addEventListener('mouseleave', () => { hideTimer = setTimeout(() => { document.getElementById('hover-popup').style.display = 'none'; }, 80); });
    t.addEventListener('click', e => { e.stopPropagation(); openModal(t); });
  });
}

/* 호버 팝업 */
const PW = 240, PH = 292;
let hideTimer;
function place(e) {
  const popup = document.getElementById('hover-popup');
  const vw = window.innerWidth, vh = window.innerHeight;
  let x = e.clientX + 18, y = e.clientY - PH / 2;
  if (x + PW > vw - 8) x = e.clientX - PW - 18;
  if (y + PH > vh - 8) y = vh - PH - 8;
  if (y < 8) y = 8;
  popup.style.left = x + 'px'; popup.style.top = y + 'px';
}

/* 모달 */
let currentThumbs = [], currentIdx = 0;
function openModal(thumb) {
  document.getElementById('hover-popup').style.display = 'none';
  const strip = thumb.closest('.ex-strip');
  currentThumbs = [...strip.querySelectorAll('.thumb')];
  currentIdx = parseInt(thumb.dataset.i, 10);
  renderModal();
  document.getElementById('modal').classList.add('open');
}
function renderModal() {
  const t = currentThumbs[currentIdx];
  document.getElementById('modal-img').className = 'modal-img ' + t.dataset.c;
  document.getElementById('modal-title').textContent = t.dataset.t;
  document.getElementById('modal-meta').textContent = t.dataset.s;
  document.getElementById('modal-dots').innerHTML = currentThumbs.map((_,i) =>
    `<div class="dot${i===currentIdx?' active':''}"></div>`).join('');
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === currentThumbs.length - 1;
}
function navigate(dir) {
  const next = currentIdx + dir;
  if (next < 0 || next >= currentThumbs.length) return;
  currentIdx = next;
  renderModal();
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'ArrowLeft') navigate(-1);
  if (e.key === 'ArrowRight') navigate(1);
  if (e.key === 'Escape') closeModal();
});

/* 행 선택 토글 (진행 중 세션만) */
function toggleRow(row) {
  if (event.target.closest('.thumb')) return;
  const s = SESSIONS[currentSession];
  if (s.ended) return;
  row.classList.toggle('selected');
  const info = row.querySelector('.ex-info');
  const wasSelected = !row.classList.contains('selected');
  if (row.classList.contains('selected')) {
    const cnt = document.querySelectorAll('.ex-row.selected').length;
    let n = info.querySelector('.pick-num');
    if (!n) { n = document.createElement('div'); n.className = 'pick-num'; info.insertBefore(n, info.firstChild); }
    n.textContent = cnt;
  } else {
    const n = info.querySelector('.pick-num');
    if (n) n.remove();
  }
  const total = document.querySelectorAll('.ex-row.selected').length;
  const countEl = document.querySelector('.count');
  if (countEl) countEl.textContent = `✦ ${total} / 10개 선정`;
}
